<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>광장 · Open Code War</title>
<meta name="description" content="Open Code War 광장 — 코딩 에이전트를 돌리는 사람들의 막사를 구경하고, 들어가서 이야기하기." />
<meta name="robots" content="noindex" />
<!-- /s/<public_id> 는 Worker(handleSpacePage)가 아래 값을 그 막사의 지금 상태로 바꾼다. og.png 교체 시 ?v= 함께 올릴 것 -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Open Code War" />
<meta property="og:title" content="광장 · Open Code War" />
<meta property="og:description" content="코딩 에이전트를 돌리는 사람들의 막사를 구경하고, 들어가서 이야기하기." />
<meta property="og:url" content="https://opencodewar.dev/plaza" />
<meta property="og:image" content="https://opencodewar.dev/og.png?v=3" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="광장 · Open Code War" />
<meta name="twitter:description" content="코딩 에이전트를 돌리는 사람들의 막사를 구경하고, 들어가서 이야기하기." />
<meta name="twitter:image" content="https://opencodewar.dev/og.png?v=3" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  :root {
    --backdrop:#E9E9E6; --bg:#F6F6F4; --fg:#1B1B1A; --dim:#6C6C68; --faint:#9C9C97;
    --line:#D6D6D2; --ok:#4F8258; --err:#B0553F; --amber:#B7862E;
    --ag-codex:#3E6FB8; --ag-opencode:#B8742E; --ag-pi:#7C55B0;
    --skin:#E8C39E; --eye:#232320;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, "D2Coding", monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --backdrop:#050504; --bg:#0E0E0D; --fg:#E7E7E3; --dim:#8C8C87; --faint:#5A5A56;
      --line:#2A2A26; --ok:#6DA875; --err:#E0785C; --amber:#D9A441; color-scheme: dark;
      --ag-codex:#7FA6E0; --ag-opencode:#D99A55; --ag-pi:#AC85DC;
    }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--backdrop); font-family:var(--mono); color:var(--fg); font-size:14px; line-height:1.5;
    padding:clamp(10px,3vw,30px); -webkit-font-smoothing:antialiased; word-break:keep-all; }
  .term { max-width:920px; margin:0 auto; background:var(--bg); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .titlebar { display:flex; align-items:center; gap:12px; padding:9px 14px; border-bottom:1px solid var(--line); font-size:12px; color:var(--dim); }
  .lights { display:flex; gap:7px; }
  .lights i { width:11px; height:11px; border-radius:50%; border:1px solid var(--faint); display:block; }
  .titlebar .name { flex:1; text-align:center; }
  .titlebar a { color:var(--dim); text-decoration:none; }
  .titlebar a:hover { color:var(--fg); }
  .screen { padding:clamp(14px,2.5vw,24px); }
  .head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .head h1 { font-size:15px; margin:0; font-weight:700; }
  .head .status { color:var(--dim); font-size:12px; }
  .hint { color:var(--dim); font-size:12px; margin:6px 0 10px; min-height:1.5em; }
  .hint b { color:var(--fg); font-weight:600; }
  .stage { position:relative; border:1px solid var(--line); border-radius:6px; overflow:hidden; outline:none; }
  .stage:focus-visible { border-color:var(--fg); }
  canvas { display:block; width:100%; image-rendering:pixelated; }
  .pad { display:none; gap:8px; margin-top:10px; }
  .pad button, .notice a.btn { font:inherit; font-size:13px; padding:8px 14px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); cursor:pointer; text-decoration:none; }
  .pad button:active { background:var(--line); }
  @media (pointer:coarse) { .pad { display:flex; } }
  .log { margin-top:12px; height:180px; overflow-y:auto; display:flex; flex-direction:column; border-top:1px solid var(--line); padding-top:8px; font-size:13px; }
  .log .spacer { flex:1; }
  .log .l { white-space:pre-wrap; overflow-wrap:anywhere; }
  .log .t { color:var(--faint); margin-right:8px; }
  .log .n { font-weight:600; margin-right:6px; }
  .log .sys { color:var(--dim); }
  .log .gb { color:var(--amber); margin-right:6px; }
  form.chat { display:flex; gap:8px; margin-top:8px; }
  form.chat input { flex:1; font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--fg); }
  form.chat input:focus { outline:none; border-color:var(--fg); }
  form.chat button { font:inherit; padding:9px 14px; border:1px solid var(--fg); border-radius:6px; background:var(--fg); color:var(--bg); cursor:pointer; }
  form.chat button:disabled, form.chat input:disabled { opacity:0.45; cursor:not-allowed; }
  form.chat button.alt { background:transparent; color:var(--fg); border-color:var(--line); }
  form.chat button.alt.on { border-color:var(--amber); color:var(--amber); }
  .notice { margin-top:10px; padding:10px 12px; border:1px dashed var(--line); border-radius:6px; color:var(--dim); font-size:12px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .notice code { color:var(--fg); }
</style>
</head>
<body>
  <div class="term">
    <div class="titlebar">
      <span class="lights"><i></i><i></i><i></i></span>
      <span class="name" id="tbName">ocw — 광장</span>
      <a href="/">보드로 ↗</a>
    </div>
    <div class="screen">
      <div class="head">
        <h1 id="title">광장</h1>
        <span class="status" id="status">연결 중…</span>
      </div>
      <div class="hint" id="hint"></div>
      <div class="stage" id="stage" tabindex="0" aria-label="광장 화면. a/d 또는 ←/→ 로 걷기, e 또는 ↑ 로 문 들어가기">
        <canvas id="cv" height="120"></canvas>
      </div>
      <div class="pad" aria-hidden="true">
        <button type="button" data-k="left">←</button>
        <button type="button" data-k="right">→</button>
        <button type="button" data-k="enter">들어가기</button>
      </div>
      <div class="notice" id="loginNotice" hidden>
        <span>지금은 구경만 할 수 있어요. 로그인하면 걷고 이야기할 수 있어요.</span>
        <a class="btn" id="loginBtn" href="/auth/login">Google 로 로그인</a>
      </div>
      <div class="log" id="log" aria-live="polite"><div class="spacer"></div></div>
      <form class="chat" id="chatForm" autocomplete="off">
        <input id="chatInput" maxlength="200" placeholder="Enter 로 채팅 · Esc 로 다시 걷기" aria-label="채팅" />
        <button type="button" class="alt" id="guestBtn" hidden>방명록</button>
        <button type="submit">보내기</button>
      </form>
      <div class="notice">
        <span>터미널에서도 같은 광장에 들어올 수 있어요: Claude Code 에서 <code>/space</code></span>
      </div>
    </div>
  </div>

<script>
(() => {
  // ── 스프라이트: mods/space 와 같은 8×10 미니 병정 (단일 원본은 web/index.html SPRITES — §16.1) ──
  const SPRITES = {
    stand: ['..HHH..R', '.HHHHH.R', '..SSE..R', '..SSS..R', '.UUUUUUR', '.U.UUU.R', '...UUU..', '...U.U..', '...U.U..', '..BB.BB.'],
    walk: ['..HHH..R', '.HHHHH.R', '..SSE..R', '..SSS..R', '.UUUUUUR', '.U.UUU.R', '...UUU..', '..U..U..', '.U....U.', 'BB....BB'],
    type1: ['........', '..HHH...', '.HHHHH..', '..SSE...', '..SSS..M', '.UUUUSSM', '.UUUU..M', '.UUUUKKK', '..UUUU..', '.BBBBBB.'],
    type2: ['........', '..HHH...', '.HHHHH..', '..SSE...', '..SSS..M', '.UUUU..M', '.UUUUSSM', '.UUUUKKK', '..UUUU..', '.BBBBBB.'],
    door: ['..LLLL..', 'WWWWWWWW', 'WIIIIIIW', 'WIIIIIIW', 'WIIIIIIW', 'WIIIIOIW', 'WIIIIIIW', 'WIIIIIIW', 'WIIIIIIW', 'WWWWWWWW'],
  };
  // 계급 이름(§16.1). 서버는 인덱스만 보낸다.
  const RANK_NAMES = ['이병', '일병', '상병', '병장', '하사', '중사', '상사', '소위', '대위', '소령', '대령', '장군'];
  const SW = 8, SH = 10, EXIT_X = 2, REACH = 6, SPEED = 40; // px/s
  const PX = 5; // 화면 배율
  const TOP = 11; // 위 여백(px): 말풍선 + 문 이름표
  const H = TOP + SH + 2 + 6; // 장면 높이(px): 말풍선 + 병정 + 바닥 + 이름표

  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const ARMY = { 'claude-code': () => css('--fg'), codex: () => css('--ag-codex'), opencode: () => css('--ag-opencode'), pi: () => css('--ag-pi') };
  const color = (ch, army, lit) => ({
    H: army, U: army, S: css('--skin'), E: css('--eye'), R: css('--fg'), B: css('--fg'), M: css('--fg'), K: css('--fg'),
    W: '#8a5a2b', I: '#3b2a1a', O: '#d9a441', L: lit ? '#ffd166' : '#5a4630',
  })[ch];

  const $ = (id) => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const logEl = $('log'), input = $('chatInput'), stage = $('stage');

  // ── 상태 ──
  const pageRoom = () => {
    const m = /^\/s\/(u-[0-9a-z]{10})$/.exec(location.pathname);
    return m ? m[1] : 'plaza';
  };
  let ws = null, gen = 0, curRoom = 'plaza';
  let you = null, room = null;
  let members = new Map(); // id → { …, dx(표시 x) }
  const me = { x: 12, dir: 1, walkUntil: 0 };
  let bubbles = {};
  let returnTo = null;
  let carryNote = null; // 입장이 거부돼 광장으로 돌아왔을 때 보여 줄 이유
  let guestMode = false;
  const END_TEXT = {
    full: '방이 꽉 찼어요 (최대 인원)',
    kicked: '주인이 내보냈어요. 잠시 뒤에 다시 들어올 수 있어요',
    banned: '이 막사에는 들어갈 수 없어요',
    closed: '이 막사는 잠겨 있어요',
  };
  const keys = { left: false, right: false };
  let lastSent = 0, lastSentX = -1;

  function sys(text) { addLine(null, text); }
  function addLine(nick, text, at, guest) {
    const d = document.createElement('div');
    d.className = 'l' + (nick ? '' : ' sys') + (guest ? ' guestline' : '');
    if (guest) { const g = document.createElement('span'); g.className = 'gb'; g.textContent = '✎ 방명록'; d.append(g); }
    if (at) { const t = document.createElement('span'); t.className = 't'; t.textContent = new Date(at).toTimeString().slice(0, 5); d.append(t); }
    if (nick) { const n = document.createElement('span'); n.className = 'n'; n.textContent = nick; d.append(n); }
    d.append(document.createTextNode(nick ? text : '· ' + text));
    logEl.append(d);
    while (logEl.children.length > 120) logEl.children[1].remove();
    logEl.scrollTop = logEl.scrollHeight;
  }
  function clearLog() { logEl.replaceChildren(Object.assign(document.createElement('div'), { className: 'spacer' })); }

  const isMember = () => you?.role === 'member';
  /** 방명록: 막사의 방문자이고 주인이 이 방에 없을 때 (§27.8) */
  function canGuest() {
    const o = room?.owner;
    if (room?.kind !== 'barracks' || !o || !isMember() || you.pid === o.pid) return false;
    return ![...members.values()].some((m) => m.pid === o.pid);
  }
  function setGuestMode(on) {
    guestMode = on && canGuest();
    $('guestBtn').classList.toggle('on', guestMode);
    input.maxLength = guestMode ? 100 : 200;
    if (isMember()) input.placeholder = guestMode ? '주인에게 남길 한 줄 (100자) · 하루 3번' : 'Enter 로 채팅 · Esc 로 다시 걷기';
  }
  const nameTag = (m) => short(m.nick, 8) + (RANK_NAMES[m.rank] ? '·' + RANK_NAMES[m.rank] : '');

  function setTitle() {
    const count = members.size + (isMember() ? 1 : 0);
    let t = '광장', s = '';
    if (room?.kind === 'plaza') { t = '광장'; s = `${count}/${room.cap}명`; }
    else if (room?.kind === 'barracks') {
      const o = room.owner;
      t = `${o?.nick ?? '?'}의 막사`;
      s = `${count}/${room.cap}명 · ` + (o?.working ? '주인 작업 중 ⌨' : o?.online ? '주인 접속 중' : '주인 외출 중') + (room.locked ? ' · 잠김🔒' : '');
    }
    $('title').textContent = t;
    $('status').textContent = s;
    $('tbName').textContent = 'ocw — ' + t;
    document.title = t + ' · Open Code War';
  }

  function doorAt(x) {
    if (!room) return null;
    if (room.kind === 'barracks') return Math.abs(x - EXIT_X) <= REACH ? { kind: 'exit' } : null;
    for (const d of room.doors ?? []) if (Math.abs(x - d.x) <= REACH) return { kind: 'enter', door: d };
    return null;
  }

  function setHint(text) { $('hint').innerHTML = text; }
  function updateHint() {
    if (!room) return;
    const d = doorAt(me.x);
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    if (!isMember()) setHint(room.kind === 'plaza' ? '켜져 있는 막사들이에요. 로그인하면 걸어가서 들어갈 수 있어요.' : '구경 중');
    else if (d?.kind === 'enter') setHint(`<b>e</b> 또는 <b>↑</b>: ${esc(d.door.nick)}의 막사로 들어가기` + (d.door.locked ? ' (잠김🔒)' : ''));
    else if (d?.kind === 'exit') setHint('<b>e</b> 또는 <b>↑</b>: 광장으로 나가기');
    else if (room.kind === 'plaza') setHint(room.doors?.length ? '<b>a/d</b>·<b>←/→</b> 로 문 앞까지 걸어가서 <b>e</b> · <b>Enter</b> 채팅' : '지금 켜진 막사가 없어요. Claude Code 에서 /space 를 켜면 문이 생겨요.');
    else setHint('<b>a/d</b>·<b>←/→</b> 이동 · 왼쪽 문에서 <b>e</b> 로 광장 · <b>Enter</b> 채팅' + (canGuest() ? ' · <b>g</b> 방명록' : ''));
  }

  // ── 연결 ──
  function connect(target) {
    const my = ++gen;
    curRoom = target;
    try { ws?.close(1000); } catch {}
    members = new Map(); bubbles = {}; you = null; room = null;
    $('status').textContent = '연결 중…';
    const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/space/ws?room=' + encodeURIComponent(target);
    const sock = new WebSocket(url);
    ws = sock;
    let keep = null;
    sock.onopen = () => { keep = setInterval(() => sock.readyState === 1 && sock.send('ping'), 25000); };
    sock.onmessage = (e) => {
      if (my !== gen || e.data === 'pong') return;
      let m; try { m = JSON.parse(e.data); } catch { return; }
      onServer(m);
    };
    sock.onclose = (e) => {
      clearInterval(keep);
      if (my !== gen) return;
      if (e.code >= 4000 && e.code <= 4004) return; // 대체·정원·강퇴·차단·잠금 — 다시 붙지 않는다
      $('status').textContent = '연결이 끊겼어요 — 다시 연결 중…';
      setTimeout(() => my === gen && connect(target), 3000);
    };
  }

  function send(o) { if (ws?.readyState === 1 && isMember()) ws.send(JSON.stringify(o)); }

  function onServer(m) {
    const now = performance.now();
    switch (m.t) {
      case 'hello': {
        you = m.you; room = m.room;
        for (const x of m.members) members.set(x.id, { ...x, dx: x.x, walkUntil: 0 });
        clearLog();
        for (const l of m.guest ?? []) addLine(l.nick, l.text, l.at, true);
        for (const l of m.chat) addLine(l.nick, l.text, l.at);
        sys((room.kind === 'plaza' ? '광장' : (room.owner?.nick ?? '?') + '의 막사') + '에 들어왔어요' + (isMember() ? '' : ' (구경 중)'));
        if (room.kind === 'barracks') me.x = EXIT_X + 10;
        else if (returnTo) { const d = room.doors?.find((d) => d.pid === returnTo); if (d) me.x = d.x; }
        else me.x = 12;
        returnTo = null;
        me.x = Math.max(0, Math.min(room.width - SW, me.x));
        if (carryNote) sys(carryNote);
        carryNote = null;
        $('loginNotice').hidden = isMember();
        input.disabled = !isMember();
        input.placeholder = isMember() ? 'Enter 로 채팅 · Esc 로 다시 걷기' : '로그인하면 이야기할 수 있어요';
        setGuestMode(false);
        const path = room.kind === 'plaza' ? '/plaza' : '/s/' + room.id;
        if (location.pathname !== path) history.pushState(null, '', path);
        $('loginBtn').href = '/auth/login?next=' + encodeURIComponent(path);
        send({ t: 'move', x: me.x, dir: me.dir });
        break;
      }
      case 'join': members.set(m.m.id, { ...m.m, dx: m.m.x, walkUntil: 0 }); sys(m.m.nick + ' 님이 들어왔어요'); break;
      case 'leave': { const x = members.get(m.id); members.delete(m.id); delete bubbles[m.id]; if (x) sys(x.nick + ' 님이 나갔어요'); break; }
      case 'move': { const x = members.get(m.id); if (x) Object.assign(x, { x: m.x, dir: m.dir, walkUntil: now + 400 }); break; }
      case 'state': { const x = members.get(m.id); if (x) x.state = m.state; break; }
      case 'said': {
        const l = m.line;
        const who = you && l.pid === you.pid ? 'me' : [...members.values()].find((x) => x.pid === l.pid)?.id;
        if (who) bubbles[who] = { text: l.text, until: now + 5000 };
        addLine(l.nick, l.text, l.at);
        break;
      }
      case 'guest': addLine(m.line.nick, m.line.text, m.line.at, true); break;
      case 'guest_clear': for (const el of logEl.querySelectorAll('.guestline')) el.remove(); break;
      case 'locked': if (room) room.locked = m.locked; sys(m.locked ? '막사가 잠겼어요 (새로 들어올 수 없음)' : '막사가 열렸어요'); break;
      case 'owner': if (room) room.owner = m.owner; break;
      case 'doors': if (room?.kind === 'plaza') { room.doors = m.doors; room.width = m.width; } break;
      case 'error':
        if (END_TEXT[m.code]) {
          // 막사에서 거부되거나 쫓겨나면 광장으로. 광장이 꽉 찼을 땐 갈 곳이 없으니 안내만.
          const from = curRoom;
          if (from !== 'plaza') {
            carryNote = END_TEXT[m.code];
            returnTo = from;
            connect('plaza');
            return;
          }
          sys(END_TEXT[m.code]);
          $('status').textContent = '꽉 참';
        } else if (m.code === 'replaced') { sys('다른 곳(터미널·다른 탭)에서 같은 계정으로 들어와서 여기 연결은 닫혔어요'); $('status').textContent = '다른 곳에서 접속 중'; }
        else if (m.code === 'slow_down') sys('조금 천천히 말해 주세요');
        else if (m.code === 'guest_limit') sys('이 막사 방명록은 하루 3번까지 쓸 수 있어요');
        else if (m.code === 'guest_owner_here') sys('주인이 와 있어요. 방명록 대신 채팅으로 말해 보세요');
        break;
    }
    setTitle(); updateHint();
    $('guestBtn').hidden = !canGuest();
    if (guestMode && !canGuest()) setGuestMode(false);
  }

  function enter() {
    if (!isMember()) return;
    const d = doorAt(me.x);
    if (!d) return;
    if (d.kind === 'enter') connect(d.door.pid);
    else { returnTo = room.id; connect('plaza'); }
  }

  // ── 입력 ──
  const typing = () => document.activeElement === input;
  addEventListener('keydown', (e) => {
    if (typing()) {
      if (e.key === 'Escape') { input.blur(); setGuestMode(false); stage.focus(); }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'a' || e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
    else if (k === 'd' || e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
    else if (k === 'e' || e.key === 'ArrowUp') { enter(); e.preventDefault(); }
    else if (e.key === 'Enter' || k === 't') { if (isMember()) { setGuestMode(false); input.focus(); e.preventDefault(); } }
    else if (k === 'g') { if (canGuest()) { setGuestMode(true); input.focus(); e.preventDefault(); } }
  });
  addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if (k === 'a' || e.key === 'ArrowLeft') keys.left = false;
    if (k === 'd' || e.key === 'ArrowRight') keys.right = false;
  });
  addEventListener('blur', () => { keys.left = keys.right = false; });
  for (const b of document.querySelectorAll('.pad button')) {
    const k = b.dataset.k;
    if (k === 'enter') b.addEventListener('click', enter);
    else {
      b.addEventListener('pointerdown', () => (keys[k] = true));
      for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) b.addEventListener(ev, () => (keys[k] = false));
    }
  }
  $('chatForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) { input.blur(); setGuestMode(false); stage.focus(); return; }
    input.value = '';
    if (guestMode) {
      // 방명록은 한 줄 남기면 끝이라 바로 걷기로 돌아간다
      send({ t: 'guest', text });
      setGuestMode(false);
      input.blur();
      stage.focus();
      return;
    }
    send({ t: 'say', text }); // 포커스는 그대로 — 계속 칠 수 있다
  });
  $('guestBtn').addEventListener('click', () => { setGuestMode(!guestMode); if (guestMode) input.focus(); });
  addEventListener('popstate', () => connect(pageRoom()));

  // ── 그리기 ──
  function drawSprite(map, x0, y0, army, mirror, lit) {
    for (let y = 0; y < map.length; y++) for (let x = 0; x < map[y].length; x++) {
      const ch = map[y][mirror ? map[y].length - 1 - x : x];
      if (ch === '.') continue;
      ctx.fillStyle = color(ch, army, lit);
      ctx.fillRect((x0 + x) * PX, (y0 + y) * PX, PX, PX);
    }
  }
  function label(text, cx, py, dim) {
    ctx.fillStyle = dim ? css('--dim') : css('--fg');
    ctx.fillText(text, cx * PX, py * PX);
  }
  const short = (s, n) => (Array.from(s).length > n ? Array.from(s).slice(0, n - 1).join('') + '…' : s);

  let last = performance.now(), t0 = last;
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (room && isMember()) {
      const dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      if (dx) {
        me.dir = dx; me.x = Math.max(0, Math.min(room.width - SW, me.x + dx * SPEED * dt)); me.walkUntil = now + 200;
        if (now - lastSent > 90 && Math.round(me.x) !== lastSentX) { lastSent = now; lastSentX = Math.round(me.x); send({ t: 'move', x: lastSentX, dir: me.dir }); updateHint(); }
      } else if (Math.round(me.x) !== lastSentX && now - lastSent > 90 && lastSentX !== -1) {
        lastSent = now; lastSentX = Math.round(me.x); send({ t: 'move', x: lastSentX, dir: me.dir }); updateHint();
      }
    }
    for (const m of members.values()) m.dx += (m.x - m.dx) * Math.min(1, dt * 10);

    // 캔버스 크기: 화면 폭에 맞춘 px 수
    const viewW = Math.max(40, Math.floor(stage.clientWidth / PX));
    if (cv.width !== viewW * PX || cv.height !== H * PX) { cv.width = viewW * PX; cv.height = H * PX; }
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.font = `${Math.round(PX * 2.4)}px ${css('--mono')}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    if (!room) { requestAnimationFrame(frame); return; }

    const width = room.width;
    const cam = Math.max(0, Math.min(Math.max(0, width - viewW), Math.round(me.x + SW / 2 - viewW / 2)));
    ctx.save();
    ctx.translate(-cam * PX, 0);
    // 바닥
    for (let x = 0; x < Math.max(width, cam + viewW); x++) { ctx.fillStyle = x % 2 ? css('--faint') : css('--dim'); ctx.fillRect(x * PX, (TOP + SH + 1) * PX, PX, PX); }
    const tick = Math.floor((now - t0) / 300);
    const owner = room.owner;

    if (room.kind === 'plaza') {
      for (const d of room.doors ?? []) {
        drawSprite(SPRITES.door, d.x, TOP, null, false, d.ownerOnline);
        label(short(d.nick, 8) + ' ' + d.count + (d.ownerWorking ? '⌨' : '') + (d.locked ? '🔒' : ''), d.x + SW / 2, TOP - 1, true);
      }
    } else {
      drawSprite(SPRITES.door, EXIT_X, TOP, null, false, true);
      label('광장', EXIT_X + SW / 2, TOP - 1, true);
      const here = owner && ((you && you.pid === owner.pid) || [...members.values()].some((m) => m.pid === owner.pid));
      const deskX = width - SW - 6;
      if (owner && !here) {
        if (owner.online) {
          drawSprite(SPRITES[owner.working ? (tick % 2 ? 'type1' : 'type2') : 'stand'], deskX, TOP, (ARMY[owner.agent] ?? ARMY['claude-code'])(), false);
          label('★' + nameTag(owner) + (owner.working ? '⌨' : ''), deskX + SW / 2, H - 1);
        } else label('외출 중', deskX + SW / 2, TOP + SH / 2, true);
      }
    }

    const ents = [...members.values()].map((m) => ({ ...m, x: m.dx, me: false }));
    if (isMember()) ents.push({ id: 'me', pid: you.pid, nick: you.nick, agent: you.agent, rank: you.rank, x: me.x, dir: me.dir, walkUntil: me.walkUntil, state: 'idle', me: true });
    for (const e of ents) {
      const isOwner = owner && e.pid === owner.pid;
      const working = e.state === 'working' || (isOwner && owner.working);
      const f = e.walkUntil > now ? (tick % 2 ? 'walk' : 'stand') : working ? (tick % 2 ? 'type1' : 'type2') : 'stand';
      drawSprite(SPRITES[f], Math.round(e.x), TOP, (ARMY[e.agent] ?? ARMY['claude-code'])(), e.dir < 0);
      const cx = Math.round(e.x) + SW / 2;
      label((e.me ? '▸' : '') + (isOwner ? '★' : '') + nameTag(e) + (working ? '⌨' : ''), cx, H - 1);
      const b = bubbles[e.id];
      if (b && b.until > now) label('「' + short(b.text, 14) + '」', cx, TOP - 6);
    }
    ctx.restore();
    requestAnimationFrame(frame);
  }

  // ── 시작 ──
  fetch('/api/session', { credentials: 'same-origin' }).catch(() => null).finally(() => {
    connect(pageRoom());
    stage.focus();
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
