<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OCW user OG</title>
<style>
  /* 소셜 카드는 단일 다크로 고정(카톡·슬랙·X 미리보기 배경과 무관하게 일관) */
  :root{
    --bg:#0E0E0D; --fg:#E7E7E3; --dim:#8C8C87; --faint:#5A5A56; --line:#2A2A26;
    --ok:#6DA875; --pi:#AC85DC; --amber:#D9A441;
    --ag-codex:#7FA6E0; --ag-opencode:#D99A55;
    --skin:#E8C39E; --eye:#232320;
    --mono: ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;}
  html,body{width:1200px;height:630px;background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden;}
  .card{width:1200px;height:630px;padding:44px 60px 38px;display:flex;flex-direction:column;position:relative;}

  /* ── 픽셀 병정(랜딩과 동일 스프라이트) ── */
  .sprite{display:block;width:100%;height:100%;}
  .px-s{fill:var(--skin);} .px-e{fill:var(--eye);} .px-r{fill:var(--fg);}
  .army-claude .px-u{fill:var(--fg);}
  .army-codex .px-u{fill:var(--ag-codex);}
  .army-opencode .px-u{fill:var(--ag-opencode);}
  .army-pi .px-u{fill:var(--pi);}

  .top{display:flex;justify-content:space-between;align-items:center;}
  .lights{display:flex;gap:11px;}
  .lights i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint);display:block;}
  .domtop{color:var(--dim);font-size:22px;}

  .cmd{margin-top:18px;color:var(--dim);font-size:22px;}
  .cmd .sig{color:var(--fg);}
  .cmd .cur{display:inline-block;width:11px;height:22px;background:var(--ok);vertical-align:-3px;margin-left:4px;}

  .idrow{display:flex;align-items:baseline;gap:18px;margin-top:22px;}
  .nick{font-size:46px;font-weight:800;letter-spacing:-0.02em;line-height:1;}
  .loc{color:var(--dim);font-size:22px;}
  .date{margin-left:auto;color:var(--dim);font-size:22px;font-variant-numeric:tabular-nums;}

  /* 히어로 = 오늘 친 글자 수. 카드의 주인공이라 최대 크기(자릿수 길면 JS가 축소). */
  .big{font-size:250px;font-weight:800;line-height:.85;letter-spacing:-0.05em;font-variant-numeric:tabular-nums;margin-top:20px;margin-left:-8px;}
  .lab{font-size:30px;color:var(--dim);margin-top:16px;}
  .lab b{color:var(--fg);}
  .lab .rec{color:var(--amber);font-weight:700;}
  .streak{font-size:24px;color:var(--amber);margin-top:12px;}
  .streak b{color:var(--fg);}
  .streak .sub{color:var(--faint);}
  .streak .rank{color:var(--fg);font-weight:700;}

  /* 작은 병정 — 오늘 활동 시 타이핑 오퍼레이터(+typing dots), 아니면 보초. 우하단 장식. */
  .soldier{position:absolute;right:64px;bottom:104px;width:76px;height:76px;}
  .sground{position:absolute;right:46px;bottom:102px;width:114px;border-bottom:2px dotted var(--line);}
  .tdots{position:absolute;top:-13px;left:14px;display:flex;gap:5px;}
  .tdots i{width:8px;height:8px;background:var(--faint);display:block;}
  .tdots i+i{opacity:.4;}

  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--faint);font-size:19px;}
  .foot .live{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:20px;}
  .foot .live i{width:11px;height:11px;border-radius:50%;background:var(--ok);display:block;}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="domtop">opencodewar.dev</div>
    </div>

    <div class="cmd"><span class="sig">you@open-code-war</span>:~$ GET /u/<span id="cmdNick"></span><span class="cur"></span></div>

    <div class="idrow">
      <span class="nick" id="nick">–</span>
      <span class="loc" id="loc"></span>
      <span class="date" id="date"></span>
    </div>

    <div class="big" id="heroNum">0</div>
    <div class="lab" id="heroLab"></div>
    <div class="streak" id="streak" style="display:none"></div>

    <i class="sground"></i>
    <span class="soldier" id="soldier"></span>

    <div class="foot">
      <div>no prompt content · character counts only</div>
      <div class="live"><i></i><span>live</span></div>
    </div>
  </div>

<script>
  // 렌더러(scripts/render-og.mjs · render-service)가 이 마커를 buildData() 결과 JSON 으로 치환한다.
  var DATA = /*OCW_DATA*/{
    nick: "dododo", country: "KR", flag: "🇰🇷", city: "Seoul",
    date: "2026-07-22", dow: "Wed",
    heroChars: 24197, heroPrompts: 178, heroIsToday: true, heroDayLabel: "",
    streak: 12, streakLongest: 30, since: "Jul 11",
    series: [], axis: { l: "", m: "", r: "" },
    stamp: "2026-07-22 · KST",
    agent: "claude-code", activeToday: true,
    allTimePrompts: 1832, allTimeChars: 1770317,
    bestPrompts: 336,
    rank: 1, bio: "A developer aiming to become a solopreneur."
  }/*END*/;

  function comma(n){ return Number(n||0).toLocaleString('en-US'); }

  // ── 픽셀 병정 스프라이트(랜딩과 동일 16×16 맵) ──
  var SPRITES = {
    typer1: [ // 타이핑 오퍼레이터 — 정지 화면이라 1프레임
      '................','................','...HHHHHH.......','..HHHHHHHH......','..HHHHHHHH......',
      '...SSSESS.......','...SSSSS........','..UUUUUU........','..UUUUUU...MM...','..UUUUUU...MM...',
      '..UUUUUSS..MM...','..UUUUU....MM...','...UUU..KKKKK...','...UUUUUU.......','...UUUUUUB......','..BBBBBBBB......'
    ],
    sentry: [ // 보초(소총 세워 듦) — 오늘 활동 없는 날
      '.........R......','...HHHHHHR......','..HHHHHHHR......','..HHHHHHHR......','...SSSESSR......',
      '...SSSSS.R......','..UUUUUUUR......','..UUUUUUSR......','..U.UUUU.R......','..U.UUUU........',
      '....UUUU........','....UUUU........','....UUUU........','....UU.UU.......','....UU..UU......','...BBB..BBB.....'
    ]
  };
  var SPRITE_CLS = { H:'u', U:'u', S:'s', E:'e', R:'r', B:'r', M:'r', K:'r' };
  function spriteSVG(name) {
    var map = SPRITES[name], rects = '';
    for (var y = 0; y < map.length; y++) for (var x = 0; x < map[y].length; x++) {
      var ch = map[y][x];
      if (ch !== '.') rects += '<rect x="' + x + '" y="' + y + '" width="1" height="1" class="px-' + SPRITE_CLS[ch] + '"/>';
    }
    return '<svg class="sprite" viewBox="0 0 ' + map[0].length + ' ' + map.length + '" width="100%" height="100%" shape-rendering="crispEdges">' + rects + '</svg>';
  }

  var d = DATA;

  document.getElementById('cmdNick').textContent = d.nick || '';
  document.getElementById('nick').textContent = d.nick || '–';
  document.getElementById('loc').textContent =
    (d.country ? d.country + ' ' + (d.flag || '') : '') + (d.city ? ' · ' + d.city : '');
  document.getElementById('date').textContent = (d.date || '') + (d.dow ? ' ' + d.dow : '');

  // 히어로 = 가장 최근 활동일의 chars(랜딩 슬로건 "How many chars…"와 같은 축). prompts 는 보조.
  var numEl = document.getElementById('heroNum');
  var numTxt = comma(d.heroChars);
  numEl.textContent = numTxt;
  // 자릿수가 길면 한 단계씩 축소 — 250px 기준 7글자(999,999)까지 한 줄에 안전.
  if (numTxt.length >= 10) numEl.style.fontSize = '150px';
  else if (numTxt.length >= 8) numEl.style.fontSize = '190px';

  // 신기록(오늘 prompts > 종전 최고)이면 라벨에 앰버 뱃지.
  var best = typeof d.bestPrompts === 'number' ? d.bestPrompts : null;
  var isRecord = !!(d.heroIsToday && best != null && best > 0 && d.heroPrompts > best);
  var when = d.heroIsToday ? 'today' : (d.heroDayLabel || '');
  document.getElementById('heroLab').innerHTML =
    '<b>chars</b> ' + when + ' · <b>' + comma(d.heroPrompts) + '</b> prompts' +
    (isRecord ? ' · <span class="rec">⭐ new best</span>' : '');

  // 스트릭 + 전체 순위 — 있는 항목만 골라 한 줄로.
  var bits = [];
  if (d.streak > 0) {
    var bestStreak = (d.streakLongest && d.streakLongest > d.streak) ? ' <span class="sub">· best ' + d.streakLongest + '</span>' : '';
    bits.push('🔥 <b>' + d.streak + '-day streak</b>' + bestStreak + (d.since ? ' <span class="sub">· since ' + d.since + '</span>' : ''));
  }
  if (typeof d.rank === 'number' && d.rank >= 1) {
    var medal = d.rank <= 3 ? ['🥇', '🥈', '🥉'][d.rank - 1] + ' ' : '';
    bits.push(medal + '<span class="rank">#' + d.rank + '</span> global');
  }
  if (bits.length) {
    var st = document.getElementById('streak');
    st.innerHTML = bits.join(' · ');
    st.style.display = 'block';
  }

  // 작은 병정: 주력 에이전트 군복 + 포즈(오늘 활동 → 타이핑+dots, 아니면 보초)
  var AGENT_ARMY = { 'claude-code':'army-claude', codex:'army-codex', opencode:'army-opencode', pi:'army-pi' };
  var soldier = document.getElementById('soldier');
  soldier.className = 'soldier ' + (AGENT_ARMY[d.agent] || 'army-claude');
  var active = d.activeToday != null ? d.activeToday : !!d.heroIsToday;
  soldier.innerHTML = active
    ? spriteSVG('typer1') + '<span class="tdots"><i></i><i></i><i></i></span>'
    : spriteSVG('sentry');
</script>
</body>
</html>
