<!doctype html>
<!-- Open Code War OG 카드 소스 (1200×630) — '대치 포스터' (og-main.html 시안 3 확정본).
     web/og.png 재생성:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
       --force-device-scale-factor=1 --window-size=1200,630 \
       --screenshot=web/og.png file://.../mockups/og.html -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg:#0E0E0D; --fg:#E7E7E3; --dim:#8C8C87; --faint:#5A5A56; --line:#2A2A26;
    --ok:#6DA875; --pi:#AC85DC;
    --ag-codex:#7FA6E0; --ag-opencode:#D99A55;
    --skin:#E8C39E; --eye:#232320;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--mono);
    position: relative; -webkit-font-smoothing: antialiased;
  }

  /* ── 픽셀 병정 (랜딩 web/index.html 과 동일 스프라이트) ── */
  .sprite { display: block; width: 100%; height: 100%; }
  .px-s { fill: var(--skin); } .px-e { fill: var(--eye); } .px-r { fill: var(--fg); }
  .army-claude .px-u { fill: var(--fg); }
  .army-codex .px-u { fill: var(--ag-codex); }
  .army-opencode .px-u { fill: var(--ag-opencode); }
  .army-pi .px-u { fill: var(--pi); }
  .flip .sprite { transform: scaleX(-1); }
  .sd { position: absolute; }

  .lights { position: absolute; top: 44px; left: 60px; display: flex; gap: 11px; }
  .lights i { width: 15px; height: 15px; border-radius: 50%; border: 1.5px solid var(--faint); display: block; }

  .big { text-align: center; font-size: 106px; font-weight: 700; letter-spacing: .04em; line-height: 1; padding-top: 128px; }
  .tag { text-align: center; color: var(--dim); font-size: 25px; line-height: 1.42; max-width: 980px; margin: 26px auto 0; }
  .tag b { color: var(--fg); font-weight: 600; }

  .field { position: absolute; inset: 0; }
  .ground { position: absolute; left: 60px; right: 60px; bottom: 104px; border-bottom: 3px dotted var(--line); }
  .tracer { position: absolute; width: 18px; height: 4px; }
  .hit { position: absolute; font-size: 22px; color: var(--faint); }
  .flash { position: absolute; width: 10px; height: 10px; background: var(--fg); }

  .foot { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; }
  .foot .dom { font-size: 27px; font-weight: 600; letter-spacing: .02em; }
  .foot .sub { margin-top: 9px; color: var(--faint); font-size: 19px; }
</style>
</head>
<body>
  <div class="lights"><i></i><i></i><i></i></div>
  <div class="big">OPEN CODE WAR</div>
  <div class="tag">Who types the most into their <b>coding agent</b>?<br/>Win the war — conquer the world with <b>your product</b>.</div>
  <div class="field" id="field"></div>
  <div class="foot">
    <div class="dom">opencodewar.dev</div>
    <div class="sub">one all-time board · no prompt content collected</div>
  </div>

<script>
  // 16×16 스프라이트 맵 (랜딩과 동일. U=군복 H=헬멧 S=피부 E=눈 R=소총 B=군화)
  const SPRITES = {
    aim: [
      '................','...HHHHHH.......','..HHHHHHHH......','..HHHHHHHH......','...SSSESS.......',
      '...SSSSS........','..UUUUUU........','.UUUUUUUSRRRRRRR','.U..UUUUSRR.....','.U..UUUU........',
      '....UUUU........','....UUUU........','....UU.UU.......','....UU.UU.......','....UU.UU.......','...BBB.BBB......',
    ],
    kneel: [
      '................','................','................','...HHHHHH.......','..HHHHHHHH......',
      '..HHHHHHHH......','...SSSESS.......','...SSSSS........','..UUUUUU........','.UUUUUUUSRRRRRRR',
      '.U..UUUUSRR.....','....UUUU........','....UUUUUU......','....UU..UU......','....UU..UU......','...BBB..BBB.....',
    ],
  };
  const CLS = { H: 'u', U: 'u', S: 's', E: 'e', R: 'r', B: 'r' };

  function spriteSVG(name) {
    const map = SPRITES[name];
    let rects = '';
    for (let y = 0; y < map.length; y++) for (let x = 0; x < map[y].length; x++) {
      const ch = map[y][x];
      if (ch === '.') continue;
      rects += `<rect x="${x}" y="${y}" width="1" height="1" class="px-${CLS[ch]}"/>`;
    }
    return `<svg class="sprite" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
  }
  const sd = (army, sprite, style, flip) =>
    `<span class="sd ${army}${flip ? ' flip' : ''}" style="${style}">${spriteSVG(sprite)}</span>`;

  // 좌우 4군 대치 — 좌: claude 입사/codex 앉아쏴, 우: opencode 입사/pi 앉아쏴 (미러)
  const S = 'width:132px;height:132px;bottom:106px;';
  document.getElementById('field').innerHTML =
    `<i class="ground"></i>` +
    sd('army-claude', 'aim', S + 'left:84px;') +
    sd('army-codex', 'kneel', S + 'left:236px;') +
    sd('army-opencode', 'aim', S + 'right:84px;', true) +
    sd('army-pi', 'kneel', S + 'right:236px;', true) +
    `<i class="flash" style="left:217px;bottom:168px;"></i>
     <i class="flash" style="left:369px;bottom:152px;"></i>
     <i class="flash" style="right:217px;bottom:168px;"></i>
     <i class="flash" style="right:369px;bottom:152px;"></i>
     <i class="tracer" style="left:430px;bottom:170px;background:var(--fg);"></i>
     <i class="tracer" style="left:562px;bottom:154px;background:var(--ag-codex);"></i>
     <i class="tracer" style="right:430px;bottom:170px;background:var(--ag-opencode);"></i>
     <i class="tracer" style="right:562px;bottom:154px;background:var(--pi);"></i>
     <b class="hit" style="left:528px;bottom:212px;">+1</b>
     <b class="hit" style="left:648px;bottom:232px;">+1</b>`;
</script>
</body>
</html>
